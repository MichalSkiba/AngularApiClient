<main class="catalogue">
  <h1>Katalog książek</h1>
  <p>Aktualizacja: {{ now | date:'dd.MM.yyyy' }}</p>
  <label for="search">Szukaj według tytułu lub autora</label>
  <input id="search" type="search" placeholder="Szukaj książki" [(ngModel)]="filter" (ngModelChange)="searchChanged()">
  <p *ngIf="loading" role="status">Pobieranie książek…</p>
  <p *ngIf="error" role="alert">{{ error }}</p>
  <p *ngIf="!loading && !error && filteredBooks.length === 0">Brak wyników.</p>
  <section class="books">
    <article *ngFor="let book of visibleBooks" class="card">
      <img *ngIf="book.url" [src]="book.url" [alt]="book.tytul || 'Okładka książki'">
      <h2>{{ book.tytul }}</h2>
      <p>{{ book.autor }}</p>
      <p>{{ book.cena | number:'1.2-2' }} PLN</p>
    </article>
  </section>
  <nav *ngIf="pageCount > 1" aria-label="Strony katalogu" class="pagination">
    <button type="button" (click)="goToPage(page - 1)" [disabled]="page <= 1">Poprzednia</button>
    <span>Strona {{ page }} z {{ pageCount }}</span>
    <button type="button" (click)="goToPage(page + 1)" [disabled]="page >= pageCount">Następna</button>
  </nav>
</main>
